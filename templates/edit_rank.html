<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><a href="/admin" class="brand">ADMIN <span>PANEL</span></a><a href="/admin" style="color: #aaa;">Back</a></nav>
    
    <div class="container edit-container">
        <div class="section-header"><i class="fas fa-edit" style="color: #ffeb3b;"></i> Edit Item: {{ rank.name }}</div>
        
        <div class="card">
            <form action="/admin/edit/{{ rank.id }}" method="POST">
                
                <div class="input-group">
                    <label class="input-label">Category</label>
                    <select name="category" class="dark-input">
                        <option value="rank" {% if rank.category == 'rank' %}selected{% endif %}>Rank</option>
                        <option value="coin" {% if rank.category == 'coin' %}selected{% endif %}>Coin Package</option>
                        <option value="tag" {% if rank.category == 'tag' %}selected{% endif %}>Chat Tag</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Name</label>
                    <input type="text" name="name" class="dark-input" value="{{ rank.name }}" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Image URL</label>
                    <input type="text" name="image_url" class="dark-input" value="{{ rank.image_url }}">
                </div>

                <div class="input-group">
                    <label class="input-label">Description</label>
                    <textarea name="description" class="dark-input" rows="3">{{ rank.description }}</textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group"><label class="input-label">Price ($)</label><input type="number" step="0.01" name="price" class="dark-input" value="{{ rank.price }}" required></div>
                    
                    <!-- UPDATED COLOR LIST -->
                    <div class="input-group"><label class="input-label">Glow Color</label>
                        <select name="color_hex" class="dark-input">
                            <option value="#00bfff" {% if rank.color_hex == '#00bfff' %}selected{% endif %}>Cyan Blue</option>
                            <option value="#ffeb3b" {% if rank.color_hex == '#ffeb3b' %}selected{% endif %}>Gold / Yellow</option>
                            <option value="#ff5252" {% if rank.color_hex == '#ff5252' %}selected{% endif %}>Red</option>
                            <option value="#00e676" {% if rank.color_hex == '#00e676' %}selected{% endif %}>Bright Green</option>
                            <option value="#e040fb" {% if rank.color_hex == '#e040fb' %}selected{% endif %}>Purple</option>
                            <option value="#ff9100" {% if rank.color_hex == '#ff9100' %}selected{% endif %}>Orange</option>
                            <option value="#ff4081" {% if rank.color_hex == '#ff4081' %}selected{% endif %}>Pink</option>
                            <option value="#ffffff" {% if rank.color_hex == '#ffffff' %}selected{% endif %}>White</option>
                            <option value="#aaaaaa" {% if rank.color_hex == '#aaaaaa' %}selected{% endif %}>Gray</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Update Item</button>
            </form>
        </div>
    </div>
</body>
</html>
