{% extends 'base.html' %}

{% block content %}

<!-- 1. HERO BANNER (Matches Shop Page) -->
<div class="hero-wrapper" style="background-image: url('{{ config.hero_background }}'); height: 280px;">
    <div class="hero-overlay-purple"></div> <!-- Uses the Purple Overlay -->
    <div style="z-index: 2; text-align: center;">
        <h1 style="font-size: 48px; font-weight: 800; text-transform: uppercase;">Vote For Us</h1>
        <p style="color: #ccc; font-size: 16px;">Vote daily to receive free rewards in-game!</p>
    </div>
</div>

<!-- 2. VOTE CARDS GRID -->
<div class="container" style="margin-top: -40px; position: relative; z-index: 10;">
    
    <div class="rules-grid"> <!-- Reusing grid layout -->
        {% for link in links %}
        <div class="vote-card">
            <!-- Icon -->
            <div class="vote-icon">
                <i class="fas fa-check-to-slot"></i>
            </div>
            
            <!-- Info -->
            <h3 class="vote-title">{{ link.site_name }}</h3>
            <p class="vote-reward"><i class="fas fa-gift"></i> {{ link.reward_desc }}</p>
            
            <!-- Button -->
            <a href="{{ link.link_url }}" target="_blank" class="vote-btn">
                Vote Now <i class="fas fa-external-link-alt"></i>
            </a>
        </div>
        {% else %}
        <div style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 50px;">
            No vote links configured yet.
        </div>
        {% endfor %}
    </div>

</div>

{% endblock %}
